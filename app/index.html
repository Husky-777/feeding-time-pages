<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正在打开「喂奶时间」...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "SF Pro Rounded", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f6f2e9;
      background-image: radial-gradient(rgba(130, 108, 90, 0.12) 1.5px, transparent 1.5px);
      background-size: 20px 20px;
      color: #3b2e26;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fffdf8;
      border: 1.5px solid rgba(74, 57, 45, 0.16);
      border-radius: 28px;
      padding: 34px 26px;
      text-align: center;
      box-shadow: 0 14px 36px rgba(82, 62, 46, 0.08);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 20px;
      background: #ffc857;
      border: 2.5px solid #3b2e26;
      box-shadow: 0 4px 0 #3b2e26;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }
    h1 { margin: 0 0 8px; font-size: 23px; font-weight: 900; }
    p { margin: 0 0 22px; color: #6d5c50; font-size: 14px; line-height: 1.65; }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 15px;
      border: 2px solid #3b2e26;
      box-shadow: 0 3px 0 #3b2e26;
      color: #3b2e26;
      background: #ffc857;
      margin-bottom: 10px;
    }
    a.sub {
      color: #8c7a6b;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🍼</div>
    <h1>喂奶时间</h1>
    <p>手账风宝宝喂养与睡眠记录工具<br/>如未自动唤起应用，可点击下方按钮打开</p>
    <a class="btn" id="open-app-btn" href="feedingtime://open">打开「喂奶时间」App</a>
    <div id="open-tip" style="display:none;margin:10px 0 12px;padding:10px 12px;border-radius:12px;background:#fff4d6;color:#7a5318;font-size:12.5px;line-height:1.6;text-align:left;"></div>
    <a class="sub" href="../index.html">返回官网首页</a>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('open-app-btn');
      var tip = document.getElementById('open-tip');
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var isWeChat = /MicroMessenger/i.test(ua);

      function showTip(msg) {
        tip.textContent = msg;
        tip.style.display = 'block';
      }

      btn.addEventListener('click', function (e) {
        if (!isIOS) {
          e.preventDefault();
          showTip('当前为电脑浏览器，无法直接唤起 iOS App。请用已安装「喂奶时间」的 iPhone 或 iPad 打开此链接即可直接唤起。');
          return;
        }
        if (isWeChat) {
          e.preventDefault();
          showTip('微信内置浏览器会拦截直接唤起，请点击右上角「···」选择「在默认浏览器（Safari）中打开」后再点击打开 App。');
          return;
        }
        var hidden = false;
        var onVis = function () { if (document.hidden) hidden = true; };
        document.addEventListener('visibilitychange', onVis, { once: true });
        setTimeout(function () {
          if (!hidden) {
            showTip('未检测到已安装的「喂奶时间」App，请先通过 TestFlight 或 App Store 安装后再试。');
          }
        }, 1600);
      });
    })();
  </script>
</body>
</html>
